plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vanishcam.mobile'
    compileSdk 36

    defaultConfig {
        applicationId 'com.vanishcam.mobile'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.0.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.18.0'
}
